<style>
/* OKB — story-driven sniper shooter. Styles adapted from the Elevator Action
   engine (overlay / HUD structure), re-themed for a spy-noir sniper mood. */

:root {
  --bg: #05070c;
  --panel: rgba(10, 13, 20, 0.92);
  --ink: #e6ecf5;
  --accent: #ff4040;
  --gold: #ffd166;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: radial-gradient(circle at 50% 0%, #10161f, var(--bg));
  color: var(--ink);
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

#game-wrapper {
  max-width: 512px;
  margin: 0 auto;
  padding: 10px;
}

#hud {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
  padding: 6px 4px;
  font: 12px/1 "Courier New", monospace;
  letter-spacing: 0.5px;
  color: #9fb0c8;
}
.hud-item b { color: var(--ink); }
#hud-targets, #hud-targets-total { color: var(--accent); }
#hud-cover { color: #4fd28a; }

#sound-toggle {
  margin-left: auto;
  background: #141a24;
  color: var(--ink);
  border: 1px solid #2a3446;
  border-radius: 6px;
  padding: 3px 8px;
  cursor: pointer;
  font-size: 14px;
}

#stage {
  position: relative;
  width: 100%;
  aspect-ratio: 512 / 480;
  background: #05070c;
  border: 1px solid #1c2636;
  border-radius: 8px;
  overflow: hidden;
}

#game {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  cursor: crosshair;
  touch-action: none;
}

#hint {
  margin: 8px 2px 0;
  font-size: 11px;
  color: #6d7c93;
  text-align: center;
}

/* ---- Overlays ---- */

.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 22px;
  text-align: center;
  background: var(--panel);
  backdrop-filter: blur(2px);
  overflow-y: auto;
}
.overlay.hidden { display: none; }

.overlay h1 {
  margin: 0;
  font-size: 46px;
  letter-spacing: 10px;
  color: #fff;
  text-shadow: 0 0 18px rgba(255, 64, 64, 0.45);
}
.overlay .subtitle { margin: 0; color: #9fb0c8; font-size: 13px; letter-spacing: 2px; }
.overlay .lede { margin: 4px 0; color: #c7d2e2; font-size: 13px; line-height: 1.7; }

.overlay .controls {
  list-style: none;
  margin: 4px 0;
  padding: 0;
  font-size: 12px;
  color: #aeb9cc;
  line-height: 2;
}
.overlay .controls b { color: var(--ink); }

button {
  font: bold 16px/1 system-ui, sans-serif;
  color: #0a0d14;
  background: var(--gold);
  border: 0;
  border-radius: 8px;
  padding: 12px 26px;
  cursor: pointer;
  letter-spacing: 2px;
  transition: transform 0.05s ease, filter 0.1s ease;
}
button:hover { filter: brightness(1.08); }
button:active { transform: translateY(1px); }
button.secondary { background: #26303f; color: var(--ink); }

.over-btns { display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* ---- Story panel ---- */

.overlay.story { justify-content: flex-start; padding-top: 34px; cursor: pointer; }
.overlay .chapter {
  margin: 0 0 10px;
  font-size: 20px;
  letter-spacing: 3px;
  color: var(--gold);
}
.story-body {
  max-width: 420px;
  text-align: left;
  min-height: 160px;
}
.story-body .line {
  margin: 0 0 12px;
  font-size: 14px;
  line-height: 1.9;
  color: #5f6d82;
  transition: color 0.25s ease;
}
.story-body .line.cur { color: #eef3fb; }
.advance {
  margin-top: auto;
  font-size: 12px;
  color: #8a97ab;
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

/* ---- Result / stats ---- */

.overlay .stats {
  list-style: none;
  margin: 6px 0;
  padding: 0;
  font: 13px/2 "Courier New", monospace;
  color: #aeb9cc;
}
.overlay .stats b { color: var(--gold); }
.overlay.result.win h1 { color: #7fe6a6; text-shadow: 0 0 18px rgba(80, 210, 140, 0.4); }
.overlay.result.over h1 { color: var(--accent); text-shadow: 0 0 18px rgba(255, 64, 64, 0.5); }

@media (max-width: 400px) {
  .overlay h1 { font-size: 36px; letter-spacing: 6px; }
  #hud { font-size: 11px; gap: 4px 8px; }
}

</style>
  <div id="game-wrapper">
    <header id="hud">
      <span class="hud-item">CH <b id="hud-mission">1</b>/1</span>
      <span class="hud-item">SCORE <b id="hud-score">0</b></span>
      <span class="hud-item">HI <b id="hud-hi">0</b></span>
      <span class="hud-item">護衛HP <b id="hud-hp">-</b>/<b id="hud-hp-max">-</b></span>
      <span class="hud-item">進行 <b id="hud-dist">0</b>%</span>
      <button id="sound-toggle" type="button" title="サウンド ON/OFF (M)">🔊</button>
    </header>

    </div>

  </div>
<script>
/**
 * Chiptune audio: synthesized SFX and a looping BGM via the Web Audio API.
 * No asset files — everything is generated from oscillators/noise so it works
 * offline and inside a sandboxed page. Audio must be resumed from a user
 * gesture (the START button/tap), per browser autoplay policy.
 *
 * Ported from the Elevator Action engine (js/audio.js) and re-scored for OKB:
 * a slower, tenser spy ostinato in D-minor that suits a sniper's stillness.
 */
(function (global) {
  "use strict";

  var ctx = null;
  var master = null;      // global volume (muting sets this to 0)
  var musicBus = null;    // sub-mix for the BGM
  var muted = false;

  var TEMPO = 104;                    // BPM — slower than the action game
  var musicTimer = null;
  var step = 0;
  var nextNoteTime = 0;

  // D-minor spy ostinato. null = rest. Lead is eighth-notes (16 steps = 2 bars).
  var LEAD = [
    587, null, 698, 587, 440, null, 587, 698,
    784, 698, 587, 523, 440, null, 349, null
  ];
  var BASS = [147, 147, 110, 110, 117, 117, 131, 131]; // quarter notes

  function ensure() {
    if (ctx) return;
    var AC = global.AudioContext || global.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.85;
    master.connect(ctx.destination);
    musicBus = ctx.createGain();
    musicBus.gain.value = 0.26;
    musicBus.connect(master);
  }

  function resume() {
    ensure();
    if (ctx && ctx.state === "suspended") ctx.resume();
  }

  // ---- One-shot voices ----------------------------------------------------

  function blip(o) {
    if (!ctx || muted) return;
    var t = ctx.currentTime;
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = o.type || "square";
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + o.dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.25, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + o.dur + 0.02);
  }

  function noiseBurst(dur, gain) {
    if (!ctx || muted) return;
    var t = ctx.currentTime;
    var n = Math.floor(ctx.sampleRate * dur);
    var buf = ctx.createBuffer(1, n, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = ctx.createBufferSource(); src.buffer = buf;
    var g = ctx.createGain(); g.gain.value = gain || 0.3;
    src.connect(g); g.connect(master);
    src.start(t);
  }

  function arpeggio(freqs, dur, type) {
    freqs.forEach(function (f, i) {
      setTimeout(function () {
        blip({ type: type || "square", f0: f, dur: dur, gain: 0.28 });
      }, i * dur * 900);
    });
  }

  var SFX = {
    // Sniper: a crisp shot then a bolt-action reload cycle.
    snipe:   function () { noiseBurst(0.12, 0.4);
                           blip({ type: "sawtooth", f0: 170, f1: 45, dur: 0.35, gain: 0.32 }); },
    reload:  function () { blip({ type: "square", f0: 300, f1: 180, dur: 0.06, gain: 0.14 });
                           setTimeout(function () { blip({ type: "square", f0: 220, f1: 320, dur: 0.06, gain: 0.14 }); }, 140); },
    lock:    function () { blip({ type: "square", f0: 1320, dur: 0.05, gain: 0.14 }); },
    empty:   function () { blip({ type: "square", f0: 140, dur: 0.05, gain: 0.12 }); }, // firing while reloading
    // Threats.
    enemyfire: function () { blip({ type: "sawtooth", f0: 520, f1: 120, dur: 0.14, gain: 0.2 }); noiseBurst(0.06, 0.15); },
    alert:   function () { blip({ type: "square", f0: 620, dur: 0.08, gain: 0.18 });
                           setTimeout(function () { blip({ type: "square", f0: 620, dur: 0.08, gain: 0.18 }); }, 120); },
    hurt:    function () { blip({ type: "sawtooth", f0: 300, f1: 70, dur: 0.4, gain: 0.3 }); }, // escort takes a hit
    explode: function () { noiseBurst(0.26, 0.32); blip({ type: "sawtooth", f0: 180, f1: 40, dur: 0.26, gain: 0.18 }); },
    // GUILTY finisher stinger (reserved for boss moments).
    guilty:  function () {
      blip({ type: "sawtooth", f0: 110, dur: 0.9, gain: 0.22 });
      blip({ type: "sawtooth", f0: 146, dur: 0.9, gain: 0.18 });
      blip({ type: "square", f0: 55, dur: 0.9, gain: 0.16 });
    },
    // Flow.
    arrive:  function () { arpeggio([523, 659, 784], 0.1, "triangle"); }, // escort reaches a checkpoint
    clear:   function () { arpeggio([523, 659, 784, 1047, 1319], 0.14, "square"); },
    over:    function () { arpeggio([392, 330, 262, 196], 0.24, "sawtooth"); },
    win:     function () { arpeggio([523, 659, 784, 1047, 1319, 1568], 0.16, "square"); },
    ui:      function () { blip({ type: "triangle", f0: 660, dur: 0.06, gain: 0.16 }); },
    text:    function () { blip({ type: "square", f0: 880, dur: 0.02, gain: 0.05 }); } // typewriter blip
  };

  function play(name) { if (SFX[name]) SFX[name](); }

  // ---- BGM scheduler (lookahead) -----------------------------------------

  function musicNote(freq, time, dur, type, gain) {
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, time);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(gain, time + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(g); g.connect(musicBus);
    osc.start(time); osc.stop(time + dur + 0.02);
  }

  function scheduler() {
    if (!ctx) return;
    var eighth = (60 / TEMPO) / 2;
    while (nextNoteTime < ctx.currentTime + 0.12) {
      var lead = LEAD[step % LEAD.length];
      if (lead) musicNote(lead, nextNoteTime, eighth * 0.9, "square", 0.09);
      if (step % 2 === 0) {
        var bass = BASS[(step / 2) % BASS.length];
        musicNote(bass, nextNoteTime, eighth * 1.7, "triangle", 0.16);
      }
      nextNoteTime += eighth;
      step = (step + 1) % LEAD.length;
    }
  }

  function startMusic() {
    ensure();
    if (!ctx || musicTimer) return;
    step = 0;
    nextNoteTime = ctx.currentTime + 0.1;
    musicTimer = setInterval(scheduler, 25);
  }

  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  function setMuted(m) {
    muted = m;
    if (master) master.gain.value = muted ? 0 : 0.85;
  }

  global.Sound = {
    resume: resume,
    play: play,
    startMusic: startMusic,
    stopMusic: stopMusic,
    setMuted: setMuted,
    isMuted: function () { return muted; }
  };
})(window);

/**
 * Input handling for OKB.
 *
 * Unlike the platformer this engine came from, OKB is aimed with a pointer:
 * the player moves a reticle over the scene and taps/clicks to fire. So this
 * module tracks (a) a small set of keyboard actions for menus/story, and
 * (b) the live pointer position over the game canvas plus a one-shot "fire"
 * edge, which the game reads each frame.
 *
 * Keyboard edge-detection (`pressed`) is kept from the original engine so
 * single-fire actions like "advance"/"start" don't auto-repeat.
 */
(function (global) {
  "use strict";

  var KEY_MAP = {
    Enter: "start",
    Space: "start",
    KeyZ: "start"
  };

  var down = {};   // currently held
  var last = {};   // held state at the end of the previous frame

  function onKey(e, isDown) {
    var action = KEY_MAP[e.code];
    if (!action) return;
    e.preventDefault();
    down[action] = isDown;
  }

  window.addEventListener("keydown", function (e) { onKey(e, true); });
  window.addEventListener("keyup", function (e) { onKey(e, false); });
  window.addEventListener("blur", function () { down = {}; });

  // ---- Pointer aiming -----------------------------------------------------

  // Reticle position in canvas pixels, and a fire edge consumed by the game.
  var aim = { x: 256, y: 240, inside: false };
  var fireQueue = [];   // canvas-space {x,y} taps waiting to be handled

  var Input = {
    /** True while `action` is held. */
    held: function (action) { return !!down[action]; },

    /** True only on the frame `action` transitions from up to down. */
    pressed: function (action) { return !!down[action] && !last[action]; },

    /** Snapshot held-state; call once at the end of every frame. */
    endFrame: function () {
      for (var k in down) last[k] = down[k];
      for (var j in last) if (!(j in down)) last[j] = false;
    },

    reset: function () { down = {}; last = {}; fireQueue.length = 0; },

    /** Current reticle position (canvas pixels) and whether it's over the canvas. */
    aim: function () { return aim; },

    /** Pull the next queued tap (canvas-space {x,y}) or null. */
    takeFire: function () { return fireQueue.length ? fireQueue.shift() : null; },

    /**
     * Bind pointer events on the game canvas so both mouse and touch drive the
     * reticle and produce fire taps. Pointer Events unify the two.
     */
    bindPointer: function (canvas) {
      function toCanvas(e) {
        var rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (canvas.width / rect.width),
          y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
      }
      canvas.addEventListener("pointermove", function (e) {
        var p = toCanvas(e);
        aim.x = p.x; aim.y = p.y; aim.inside = true;
      });
      canvas.addEventListener("pointerleave", function () { aim.inside = false; });
      canvas.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        var p = toCanvas(e);
        aim.x = p.x; aim.y = p.y; aim.inside = true;
        fireQueue.push(p);
      });
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    }
  };

  global.Input = Input;

  // Flag coarse-pointer (touch) devices so the layout can adapt.
  function init() {
    var touch = ("ontouchstart" in window) ||
      (window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
    if (touch && document.body) document.body.classList.add("touch");
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})(window);

/**
 * Game actors for OKB and shared helpers.
 *
 * OKB is an escort-sniper game: the player never moves a character on the
 * ground. Instead an ESCORT (the protagonist of the previous game, now under
 * OKB's protection) walks autonomously toward the exit, and ENEMIES appear to
 * stop them. The player is the sniper overhead who taps enemies to remove them
 * before they can harm the escort.
 *
 * Carried over from the Elevator Action engine: the AABB `overlaps`/point-hit
 * helpers and the `px` pixel-sprite primitive. The platformer physics
 * (moveAndCollide, gravity, elevators) are dropped.
 */
(function (global) {
  "use strict";

  // ---- AABB / hit-test helpers -------------------------------------------

  function overlaps(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function pointIn(px, py, r, pad) {
    pad = pad || 0;
    return px >= r.x - pad && px <= r.x + r.w + pad &&
           py >= r.y - pad && py <= r.y + r.h + pad;
  }

  function px(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x | 0, y | 0, w, h);
  }

  // ---- Escort: the previous game's protagonist, walking to the exit -------

  var ESC_W = 16, ESC_H = 36;

  function Escort(opts) {
    this.w = ESC_W;
    this.h = ESC_H;
    this.speed = opts.speed != null ? opts.speed : 0.5;
    this.x = opts.x;
    this.baseY = opts.y - this.h;      // feet rest on ground line `y`
    this.y = this.baseY;
    this.dir = 1;
    this.walk = 0;
    this.maxHp = opts.hp || 5;
    this.hp = this.maxHp;
    this.hurtFlash = 0;
    this.stunned = 0;                  // brief pause after being hit
    this.arrived = false;
  }

  Escort.prototype.update = function (exitX) {
    if (this.hurtFlash > 0) this.hurtFlash--;
    if (this.stunned > 0) { this.stunned--; }
    else { this.x += this.speed; this.walk += this.speed + 0.15; }
    this.y = this.baseY + Math.sin(this.walk * 0.9) * 1.0;
    if (this.x + this.w / 2 >= exitX) this.arrived = true;
  };

  Escort.prototype.hurt = function () {
    this.hp--;
    this.hurtFlash = 26;
    this.stunned = 20;
  };

  Escort.prototype.rect = function () {
    return { x: this.x, y: this.y, w: this.w, h: this.h };
  };

  Escort.prototype.draw = function (ctx) {
    var x = this.x, y = this.y;
    var flash = this.hurtFlash > 0 && (this.hurtFlash >> 2) % 2 === 0;
    var coat = flash ? "#ffffff" : "#2f4a6b";   // trench coat (spy blue)
    var skin = flash ? "#ffffff" : "#e7c8a0";
    var stride = Math.sin(this.walk) * 2.4;
    // Legs.
    px(ctx, x + 3, y + 28, 4, 8 - Math.max(0, stride), "#20252e");
    px(ctx, x + 9, y + 28, 4, 8 - Math.max(0, -stride), "#20252e");
    // Trench coat.
    px(ctx, x + 2, y + 13, 12, 16, coat);
    px(ctx, x + 1, y + 26, 14, 4, coat);        // coat skirt
    // Arms.
    px(ctx, x, y + 14, 3, 11, coat);
    px(ctx, x + 13, y + 14, 3, 11, coat);
    // Head + fedora (the previous protagonist's silhouette).
    px(ctx, x + 4, y + 3, 8, 9, skin);
    px(ctx, x + 2, y + 1, 12, 3, flash ? "#ffffff" : "#1c2129"); // hat brim
    px(ctx, x + 4, y - 2, 8, 4, flash ? "#ffffff" : "#232a34");   // hat crown
    // A faint blue protectee marker ring at the feet.
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = "#5aa0ff"; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(x + this.w / 2, y + this.h - 1, 11, 3, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  };

  // ---- Enemy: gunner (ranged) or rusher (melee) ---------------------------

  var EN_W = 16, EN_H = 32;
  // Phase budgets (frames @60fps).
  var EMERGE = 16;
  var GUN_AIM = 78;          // telegraph before a gunner fires
  var BOSS_AIM = 150;        // the boss winds up longer (dramatic)

  function Enemy(opts) {
    this.w = EN_W;
    this.h = EN_H;
    this.type = opts.type || "gunner";
    this.boss = !!opts.boss;
    this.x = opts.x;
    this.baseY = opts.y - this.h;
    this.y = this.baseY;
    this.dir = opts.dir || -1;         // facing
    this.speed = opts.speed != null ? opts.speed : 0.95; // rushers
    this.timer = 0;
    this.dead = false;
    this.gone = false;                 // left the field harmlessly
    this.phase = "emerge";
    this.charge = 0;                   // 0..1 telegraph progress (gunner)
    this.aimTime = this.boss ? BOSS_AIM : GUN_AIM;
    this.run = 0;                      // rusher animation
  }

  Enemy.prototype.aiming = function () {
    return this.type === "gunner" && this.phase === "aim";
  };

  /** Advance; returns an event: "fire" (gunner shot), "contact" (rusher hit), or null. */
  Enemy.prototype.update = function (escort) {
    this.timer++;
    if (this.type === "gunner") {
      if (this.timer < EMERGE) { this.phase = "emerge"; this.y = this.baseY + (EMERGE - this.timer); return null; }
      this.y = this.baseY;
      var at = this.timer - EMERGE;
      if (at < this.aimTime) {
        this.phase = "aim";
        this.charge = at / this.aimTime;
        return null;
      }
      // Fire, then wind up again for the next shot.
      this.phase = "fire";
      this.timer = EMERGE;
      this.charge = 0;
      return "fire";
    }
    // Rusher: emerge, then run toward the escort's centre.
    if (this.timer < EMERGE) { this.phase = "emerge"; return null; }
    this.phase = "run";
    this.run += this.speed;
    var tx = escort.x + escort.w / 2;
    var cx = this.x + this.w / 2;
    this.dir = tx < cx ? -1 : 1;
    this.x += this.dir * this.speed;
    if (Math.abs((this.x + this.w / 2) - tx) < 12) { this.dead = true; return "contact"; }
    return null;
  };

  Enemy.prototype.rect = function () { return { x: this.x, y: this.y, w: this.w, h: this.h }; };
  Enemy.prototype.hit = function (px, py) { return !this.dead && pointIn(px, py, this.rect(), 5); };

    var x = this.x, y = this.y;

  function hideOverlay() { overlay.classList.add("hidden"); overlay.onclick = null; }
  function showOverlayHTML(cls, html) {
    overlay.className = "overlay " + (cls || "");
    overlay.innerHTML = html;
    overlay.classList.remove("hidden");
  }

  function showMenu() {
    game.state = STATE.MENU;
    game.scene = null;
    if (global.Sound) global.Sound.stopMusic();
    showOverlayHTML("menu",
      '<h1>OKB</h1>' +
      '<p class="subtitle">' + STORY.subtitle + '</p>' +
      '<p class="lede">あなたは屋上のスナイパー。<br>' +
      '護衛対象（前作の主人公）が自ら出口へ歩く。<br>' +
      '妨害しに現れる敵をタップ／クリックで狙撃し、守り抜け。</p>' +
      '<ul class="controls">' +
      '<li>🖱 / 👆 <b>照準＆射撃</b>（1発ごとにリロード）</li>' +
      '<li>🟥 <b>敵</b>（撃つ）｜ 🟦 <b>護衛対象</b>（守る）</li>' +
      '<li>⚠ 予兆中に撃て。撃たれると護衛のHPが減る</li>' +
      '</ul>' +
      '<button id="start-btn">START</button>');
    document.getElementById("start-btn").addEventListener("click", function () {
      snd("ui"); if (global.Sound) global.Sound.resume(); startGame();
    });
  }

  function startGame() {
    game.score = 0;
    game.chapterIdx = 0;
    beginCut(STORY.prologue, function () { beginChapter(0); });
  }

  // ---- Cutscenes ----------------------------------------------------------

  function beginCut(script, next) {
    if (global.Sound) global.Sound.stopMusic();
    game.cut = CUT.make(script);
    game.cutNext = next;
    game.state = STATE.CUTSCENE;
    hideOverlay();
  }

  function beginChapter(i) {
    game.chapterIdx = i;
    if (i >= STORY.chapters.length) { beginEnding(); return; }
    beginCut(STORY.chapters[i].intro, startMission);
  }

  function beginEnding() {
    beginCut(STORY.ending, function () {
      snd("win");
      showOverlayHTML("result win",
        '<h1>ALL CLEAR</h1>' +
        '<p class="subtitle">護衛対象は無事に脱出した。</p>' +
        '<p class="lede">最終スコア <b>' + game.score + '</b> ／ HI <b>' + game.hi + '</b></p>' +
        '<button id="start-btn">TITLE へ</button>');
      game.state = STATE.ENDING;
      document.getElementById("start-btn").addEventListener("click", function () { snd("ui"); showMenu(); });
    });
  }

  // ---- Mission ------------------------------------------------------------

  function startMission() {
    var chap = STORY.chapters[game.chapterIdx];
    var sc = SCENES.get(chap.scene);
    game.scene = sc;
    game.escort = new Entities.Escort({ x: sc.startX, y: sc.ground, speed: sc.escortSpeed, hp: sc.escortHp });
    game.enemies = [];
    game.spawnIdx = 0;
    game.frame = 0;
    game.cooldown = 0;
    game.killed = 0;
    game.shots = 0;
    game.finisher = null;
    game.effects = [];
    game.tracers = [];
    game.shotFlash = 0;
    game.msgTimer = 0;
    while (Input.takeFire()) {}
    hideOverlay();
    game.state = STATE.PLAY;
    if (global.Sound) { global.Sound.resume(); global.Sound.startMusic(); }
    flash("護衛開始 ―― " + sc.name, "#ffd166");
    syncHud();
  }

  function spawnDue() {
    var sp = game.scene.spawns;
    while (game.spawnIdx < sp.length && game.frame >= sp[game.spawnIdx].t) {
      var e = sp[game.spawnIdx++];
      var x = e.x;
      if (e.side === "left") x = -20;
      else if (e.side === "right") x = SCENES.W + 4;
      game.enemies.push(new Entities.Enemy({
        x: x, y: game.scene.ground, type: e.type, dir: e.dir,
        speed: e.speed, boss: e.boss
      }));
      if (e.type === "rusher" || e.boss) snd("alert");
    }
  }

  function updateEnemies() {
    var live = [];
    for (var i = 0; i < game.enemies.length; i++) {
      var e = game.enemies[i];
      if (e.dead) continue;
      var ev = e.update(game.escort);
      if (ev === "fire") {
        gunnerFire(e);
      } else if (ev === "contact") {
        game.escort.hurt();
        snd("hurt");
        addSpark(game.escort.x + game.escort.w / 2, game.escort.y + 14, "#ff5a5a");
        flash("護衛が接触された！", "#ff5a5a");
      }
      if (!e.dead) live.push(e);
    }
    game.enemies = live;
  }

  function gunnerFire(e) {
    var ex = e.dir > 0 ? e.x + e.w + 4 : e.x - 4;
    var tx = game.escort.x + game.escort.w / 2;
    var ty = game.escort.y + 10;
    game.tracers.push({ x0: ex, y0: e.y + 15, x1: tx, y1: ty, t: 0 });
    game.escort.hurt();
    snd("enemyfire"); snd("hurt");
    addSpark(tx, ty, "#ff8a3a");
    flash("護衛が撃たれた！", "#ff5a5a");
  }

  function addSpark(x, y, color) {
    game.effects.push({ x: x, y: y, t: 0, color: color || "#ffd166" });
  }

  function missionClear() {
    if (global.Sound) global.Sound.stopMusic();
    snd("clear");
    var acc = game.shots > 0 ? Math.round((game.killed / game.shots) * 100) : 100;
    var hpBonus = game.escort.hp * 400;
    game.score += hpBonus;
    commitHi();
    game.state = STATE.RESULT;
    var chap = STORY.chapters[game.chapterIdx];
    showOverlayHTML("result win",
      '<h1>護衛成功</h1>' +
      '<p class="subtitle">' + chap.title + '</p>' +
      '<ul class="stats">' +
      '<li>命中率 <b>' + acc + '%</b></li>' +
      '<li>護衛の残HP <b>' + game.escort.hp + '</b> ＝ +' + hpBonus + '</li>' +
      '<li>SCORE <b>' + game.score + '</b></li>' +
      '</ul>' +
      '<button id="next-btn">次へ</button>');
    document.getElementById("next-btn").addEventListener("click", function () {
      snd("ui");
      beginCut(chap.outro, function () { beginChapter(game.chapterIdx + 1); });
    });
  }

  function missionFail() {
    if (global.Sound) global.Sound.stopMusic();
    snd("over");
    commitHi();
    game.state = STATE.OVER;
    showOverlayHTML("result over",
      '<h1>護衛失敗</h1>' +
      '<p class="subtitle">護衛対象が倒れた。契約は破談だ。</p>' +
      '<p class="lede">SCORE ' + game.score + ' ／ HI ' + game.hi + '</p>' +
      '<div class="over-btns">' +
      '<button id="retry-btn">このステージを再開</button>' +
      '<button id="title-btn" class="secondary">TITLE</button>' +
      '</div>');
    document.getElementById("retry-btn").addEventListener("click", function () { snd("ui"); startMission(); });
    document.getElementById("title-btn").addEventListener("click", function () { snd("ui"); showMenu(); });
  }

  function commitHi() {
    if (game.score > game.hi) {
      game.hi = game.score;
      try { localStorage.setItem("okb_hi", String(game.hi)); } catch (e) {}
    }
  }
  function addScore(n) { game.score += n; commitHi(); syncHud(); }
  function flash(msg, color) { game.msg = msg; game.msgColor = color || "#fff"; game.msgTimer = 70; }

  // ---- Shooting -----------------------------------------------------------

  function handleShoot(p) {
    if (game.cooldown > 0) { snd("empty"); return; }   // still cycling the bolt
    game.shots++;
    // Topmost enemy under the tap wins.
    for (var i = game.enemies.length - 1; i >= 0; i--) {
      var e = game.enemies[i];
      if (e.hit(p.x, p.y)) {
        if (e.boss) { startFinisher(e); return; }   // boss = dramatic GUILTY, no cooldown
        killEnemy(e);
        fireCooldown();
        return;
      }
    }
    // Missed shot into empty air — still costs a reload cycle.
    game.shotFlash = 6;
    snd("snipe");
    fireCooldown();
  }

  function killEnemy(e) {
    e.dead = true;
    game.killed++;
    addScore(500);
    addSpark(e.x + e.w / 2, e.y + 6, "#ff5a5a");
    game.shotFlash = 6;
    snd("snipe");
  }

  function fireCooldown() {
    game.cooldown = COOLDOWN_MAX;
    setTimeout(function () { snd("reload"); }, 180);
  }

  // Boss finisher: the one place the full "GUILTY" freeze returns.
  var SNIPE = { zoom: 54, aim: 44, guilty: 62, fire: 20, after: 46 };

  function startFinisher(e) {
    game.finisher = { enemy: e, phase: "zoom", t: 0 };
    snd("lock");
  }

  function updateFinisher() {
    var s = game.finisher;
    s.t++;
    if (s.phase === "zoom" && s.t >= SNIPE.zoom) { s.phase = "aim"; s.t = 0; snd("lock"); }
    else if (s.phase === "aim" && s.t >= SNIPE.aim) { s.phase = "guilty"; s.t = 0; snd("guilty"); }
    else if (s.phase === "guilty" && s.t >= SNIPE.guilty) { s.phase = "fire"; s.t = 0; snd("snipe"); }
    else if (s.phase === "fire" && s.t >= SNIPE.fire) {
      s.enemy.dead = true;
      game.enemies = game.enemies.filter(function (x) { return !x.dead; });
      game.killed++;
      addScore(3000);
      snd("explode");
      s.phase = "after"; s.t = 0;
    } else if (s.phase === "after" && s.t >= SNIPE.after) {
      game.finisher = null;
      game.cooldown = 16;
    }
  }

  // ---- Tick ---------------------------------------------------------------

  function tick() {
    update();
    draw();
    Input.endFrame();
    requestAnimationFrame(tick);
  }

  function update() {
    if (game.msgTimer > 0) game.msgTimer--;
    if (game.shotFlash > 0) game.shotFlash--;

    if (game.state === STATE.CUTSCENE) {
      if (game.cut) {
        game.cut.update();
        if (Input.pressed("start")) game.cut.advance();
        if (game.cut.finished) { var n = game.cutNext; game.cut = null; game.cutNext = null; if (n) n(); }
      }
      // Consume any stray taps so they don't leak into PLAY.
      while (Input.takeFire()) {}
      return;
    }

    if (game.state !== STATE.PLAY) return;

    // Advance transient visuals regardless of freeze.
    for (var t = game.tracers.length - 1; t >= 0; t--) { if (++game.tracers[t].t > 12) game.tracers.splice(t, 1); }
    for (var f = game.effects.length - 1; f >= 0; f--) { if (++game.effects[f].t > 20) game.effects.splice(f, 1); }

    // The boss finisher freezes the world.
    if (game.finisher) { updateFinisher(); while (Input.takeFire()) {} return; }

    if (game.cooldown > 0) game.cooldown--;
    game.frame++;

    game.escort.update(game.scene.exitX);
    spawnDue();
    updateEnemies();

    if (game.escort.hp <= 0) { missionFail(); return; }
    if (game.escort.arrived) { snd("arrive"); missionClear(); return; }

    var tap = Input.takeFire();
    if (tap) handleShoot(tap);

    syncHud();
  }

  // ---- Draw ---------------------------------------------------------------

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (game.state === STATE.CUTSCENE && game.cut) { game.cut.draw(ctx); return; }

    if (game.state === STATE.MENU || game.state === STATE.RESULT ||
        game.state === STATE.OVER || game.state === STATE.ENDING) {
      if (game.scene) { ctx.globalAlpha = 0.5; game.scene.drawBg(ctx); ctx.globalAlpha = 1; }
      return;
    }

    // PLAY.
    ctx.save();
    var fn = game.finisher;
    if (fn && fn.phase !== "guilty") {
      var z = snipeZoom(fn);
      var zx = fn.enemy.x + fn.enemy.w / 2;
      var zy = fn.enemy.y + 8;
      var shake = fn.phase === "fire" ? (Math.random() - 0.5) * 6 : 0;
      ctx.translate(zx + shake, zy + shake);
      ctx.scale(z, z);
      ctx.translate(-zx, -zy);
    }

    game.scene.drawBg(ctx);
    drawExit();
    if (game.escort) game.escort.draw(ctx);
    for (var i = 0; i < game.enemies.length; i++) game.enemies[i].draw(ctx);
    drawTracers();
    drawSparks();
    if (game.escort) drawEscortHp();
    ctx.restore();

    if (!fn) drawReticle();

    if (fn) {
      if (fn.phase === "guilty") drawGuiltyCut(fn.t);
      else if (fn.phase === "after") drawAfterglow(fn);
      else drawScope(fn);
    }
    if (game.shotFlash > 0) { ctx.fillStyle = "rgba(255,255,255,0.14)"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    if (game.msgTimer > 0) drawFlash();
  }

  function drawExit() {
    var x = game.scene.exitX, gy = game.scene.ground;
    var g = ctx.createRadialGradient(x, gy - 24, 6, x, gy - 24, 60);
    g.addColorStop(0, "rgba(120,220,150,0.4)"); g.addColorStop(1, "rgba(120,220,150,0)");
    ctx.fillStyle = g; ctx.fillRect(x - 60, gy - 90, 120, 90);
    ctx.fillStyle = "#7fe6a6"; ctx.font = "bold 11px 'Courier New', monospace";
    ctx.textAlign = "center"; ctx.fillText("EXIT", x, gy - 60);
    ctx.textAlign = "left";
    // A small kind-specific icon.
    ctx.fillStyle = "#9fb0c8";
    if (game.scene.exit === "boat") { ctx.fillRect(x - 16, gy - 10, 32, 6); ctx.fillRect(x - 2, gy - 24, 3, 14); }
    else if (game.scene.exit === "heli") { ctx.fillRect(x - 20, gy - 40, 40, 2); ctx.fillRect(x - 8, gy - 38, 16, 8); }
    else { ctx.fillRect(x - 10, gy - 34, 20, 34); }
  }

  function drawTracers() {
    for (var i = 0; i < game.tracers.length; i++) {
      var tr = game.tracers[i];
      var a = clamp(1 - tr.t / 12, 0, 1);
      ctx.strokeStyle = "rgba(255,140,60," + (a * 0.9) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(tr.x0, tr.y0); ctx.lineTo(tr.x1, tr.y1); ctx.stroke();
    }
  }

  function drawSparks() {
    for (var i = 0; i < game.effects.length; i++) {
      var e = game.effects[i];
      var a = clamp(1 - e.t / 20, 0, 1);
      ctx.fillStyle = e.color;
      for (var k = 0; k < 6; k++) {
        var ang = k * Math.PI / 3, len = 3 + e.t * 1.4;
        ctx.globalAlpha = a;
        ctx.fillRect(e.x + Math.cos(ang) * len - 1.5, e.y + Math.sin(ang) * len - 1.5, 3, 3);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawEscortHp() {
    var e = game.escort, cx = e.x + e.w / 2;
    for (var i = 0; i < e.maxHp; i++) {
      ctx.fillStyle = i < e.hp ? "#5aa0ff" : "rgba(120,130,140,0.35)";
      ctx.fillRect(cx - e.maxHp * 3 + i * 6, e.y - 10, 4, 4);
    }
  }

  function drawReticle() {
    var a = Input.aim();
    if (!a.inside) return;
    var x = a.x, y = a.y;
    var ready = game.cooldown <= 0;
    var onEnemy = false;
    for (var i = 0; i < game.enemies.length; i++) {
      if (game.enemies[i].hit(x, y)) { onEnemy = true; break; }
    }
    ctx.save();
    var col = !ready ? "rgba(150,160,175,0.7)" : onEnemy ? "rgba(255,70,70,0.95)" : "rgba(230,236,245,0.85)";
    ctx.strokeStyle = col; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 20, y); ctx.lineTo(x - 6, y);
    ctx.moveTo(x + 6, y); ctx.lineTo(x + 20, y);
    ctx.moveTo(x, y - 20); ctx.lineTo(x, y - 6);
    ctx.moveTo(x, y + 6); ctx.lineTo(x, y + 20);
    ctx.stroke();
    // Reload arc.
    if (!ready) {
      ctx.strokeStyle = "rgba(255,209,102,0.9)"; ctx.lineWidth = 3;
      var prog = 1 - game.cooldown / COOLDOWN_MAX;
      ctx.beginPath(); ctx.arc(x, y, 18, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = col; ctx.fillRect(x - 1, y - 1, 2, 2);
    ctx.restore();
  }

  function drawFlash() {
    var a = Math.min(1, game.msgTimer / 45);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = game.msgColor;
    ctx.font = "bold 20px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.fillText(game.msg, canvas.width / 2, 62);
    ctx.restore();
    ctx.textAlign = "left";
  }

  // ---- Boss finisher rendering (ported from Elevator Action) --------------

  function snipeZoom(s) {
    var Z = 2.7;
    if (s.phase === "zoom") return 1 + (Z - 1) * smooth(s.t / SNIPE.zoom);
    if (s.phase === "after") return 1 + (Z - 1) * (1 - smooth(s.t / SNIPE.after));
    return Z;
  }

  function drawScope(s) {
    var W = canvas.width, H = canvas.height;
    var e = s.enemy;
    var tx = e.x + e.w / 2;
    var ty = e.y + 8;
    var sway = s.phase === "aim" ? 2.5 : 0;
    tx += Math.sin(s.t / 9) * sway;
    ty += Math.cos(s.t / 11) * sway;
    var full = Math.max(W, H) * 1.15, rMin = 96;
    var r = s.phase === "zoom" ? full - (full - rMin) * smooth(s.t / SNIPE.zoom) : rMin;

    ctx.save();
    if (s.phase === "zoom" || s.phase === "aim") { ctx.fillStyle = "rgba(50,90,170,0.12)"; ctx.fillRect(0, 0, W, H); }
    ctx.fillStyle = "rgba(2,3,8,0.93)";
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(tx, ty, r, 0, Math.PI * 2, true); ctx.fill("evenodd");
    ctx.lineWidth = 12; ctx.strokeStyle = "#04050a"; ctx.beginPath(); ctx.arc(tx, ty, r, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = "#2a3350"; ctx.beginPath(); ctx.arc(tx, ty, r - 6, 0, Math.PI * 2); ctx.stroke();
    ctx.save();
    ctx.beginPath(); ctx.arc(tx, ty, r - 6, 0, Math.PI * 2); ctx.clip();
    ctx.strokeStyle = "rgba(235,70,70,0.85)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(tx - r, ty); ctx.lineTo(tx + r, ty); ctx.moveTo(tx, ty - r); ctx.lineTo(tx, ty + r); ctx.stroke();
    for (var k = -6; k <= 6; k++) {
      if (!k) continue;
      ctx.beginPath();
      ctx.moveTo(tx + k * 10, ty - 3); ctx.lineTo(tx + k * 10, ty + 3);
      ctx.moveTo(tx - 3, ty + k * 10); ctx.lineTo(tx + 3, ty + k * 10);
      ctx.stroke();
    }
    if (s.phase === "aim") {
      var pr = 26 + (Math.sin(s.t / 5) + 1) * 8;
      ctx.strokeStyle = "rgba(255,80,80,0.7)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(tx, ty, pr, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = "rgba(255,50,50,0.95)"; ctx.fillRect(tx - 2, ty - 2, 4, 4);
    ctx.restore();
    ctx.textAlign = "center";
    if (s.phase === "zoom" || s.phase === "aim") {
      ctx.fillStyle = "#ff6a6a"; ctx.font = "bold 13px 'Courier New', monospace";
      ctx.fillText("O K B", tx, ty - r + 22);
      ctx.fillStyle = "rgba(180,200,230,0.7)"; ctx.font = "11px 'Courier New', monospace";
      ctx.fillText("RANGE 1200m  WIND 3", tx, ty + r - 14);
      if (s.phase === "aim" && Math.floor(s.t / 8) % 2 === 0) {
        ctx.fillStyle = "#ffd166"; ctx.font = "bold 16px 'Courier New', monospace";
        ctx.fillText("TARGET LOCKED", W / 2, H - 30);
      }
    }
    if (s.phase === "fire") {
      var a = 1 - s.t / SNIPE.fire;
      ctx.fillStyle = "rgba(255,255,255," + (a * 0.95) + ")"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ff2a2a";
      for (var b = 0; b < 12; b++) { var ang = b * Math.PI / 6, len = 6 + s.t * 3; ctx.fillRect(tx + Math.cos(ang) * len - 2, ty + Math.sin(ang) * len - 2, 5, 5); }
      ctx.fillStyle = "#fff"; ctx.font = "bold 24px 'Courier New', monospace"; ctx.fillText("HEADSHOT!", W / 2, 54);
    }
    ctx.textAlign = "left";
    ctx.restore();
  }

  function drawAfterglow(s) {
    var W = canvas.width, H = canvas.height;
    var u = clamp(s.t / SNIPE.after, 0, 1);
    var fade = 1 - smooth(u);
    ctx.save();
    ctx.fillStyle = "rgba(50,90,170," + (0.10 * fade) + ")"; ctx.fillRect(0, 0, W, H);
    var g = ctx.createRadialGradient(W / 2, H / 2, 70, W / 2, H / 2, W * 0.85);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0," + (0.5 * fade) + ")");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (u < 0.85) {
      ctx.globalAlpha = clamp(1 - u / 0.85, 0, 1);
      ctx.fillStyle = "#ff5a5a"; ctx.font = "bold 22px 'Courier New', monospace";
      ctx.textAlign = "center"; ctx.fillText("首魁を撃破", W / 2, 58);
      ctx.globalAlpha = 1; ctx.textAlign = "left";
    }
    ctx.restore();
  }

  function drawGuiltyCut(t) {
    var W = canvas.width, H = canvas.height;
    var intro = clamp(t / 9, 0, 1);
    var shake = t < 9 ? (1 - intro) * 7 : 0;
    ctx.save();
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    var zc = 1 + (1 - smooth(intro)) * 0.08;
    ctx.translate(W / 2, H / 2); ctx.scale(zc, zc); ctx.translate(-W / 2, -H / 2);
    ctx.fillStyle = "#cbd1db"; ctx.fillRect(-30, -30, W + 60, H + 60);
    ctx.fillStyle = "#3c414d";
    inkCloud(60, 54, 150, 40); inkCloud(280, 38, 180, 52); inkCloud(470, 96, 150, 46);
    hatch(0, 0, W, 150, 7, -1, "rgba(20,22,28,0.30)");
    ctx.strokeStyle = "rgba(20,22,28,0.18)"; ctx.lineWidth = 1;
    for (var a = 0; a < 22; a++) { var yy0 = 150 + a * 16; ctx.beginPath(); ctx.moveTo(W, 250); ctx.lineTo(-20, yy0); ctx.stroke(); }
    ctx.fillStyle = "#242932";
    var bx = [-10, 40, 78, 120, 150, 196, 250, 300, 470, 500];
    var bh = [120, 165, 96, 140, 80, 130, 100, 150, 90, 130];

  function inkCloud(x, y, w, h) {
